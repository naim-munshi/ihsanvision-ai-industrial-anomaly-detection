name: Python quality checks

on:
  push:
    branches: [main, MdNaim, "feature/**"]
  pull_request:
    branches: [main, MdNaim]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install lightweight test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install IhsanVision package in editable mode (without ML runtimes)
        run: python -m pip install -e . --no-deps
      - name: Verify canonical and legacy entry points
        run: |
          python -c "import ihsanvision.api, ihsanvision.train, ihsanvision.benchmark; import src.api; assert ihsanvision.api is src.api"
          python -m ihsanvision.train --help
          python -m src.train --help
      - name: Compile code
        run: python -m compileall -q ihsanvision src scripts tests
      - name: Run tests
        run: python -m pytest -q
