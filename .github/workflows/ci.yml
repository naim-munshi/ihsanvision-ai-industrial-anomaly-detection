name: Python quality checks

on:
  push:
    branches: [main, "feature/**", "chore/**"]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install lightweight test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install IhsanVision package in editable mode (without ML runtimes)
        run: python -m pip install -e . --no-deps
      - name: Verify canonical and legacy entry points
        run: |
          python -c "import ihsanvision.api, ihsanvision.train, ihsanvision.benchmark; import src.api; assert ihsanvision.api is src.api"
          python -m ihsanvision.train --help
          python -m src.train --help
      - name: Compile code
        run: python -m compileall -q ihsanvision src scripts tests
      - name: Run tests
        run: python -m pytest -q
      - name: Configure Node for dependency-free dashboard behavior tests
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Exercise dashboard DOM state and API error handling
        run: node --test tests/dashboard.test.cjs tests/batch_dashboard.test.cjs tests/history_dashboard.test.cjs

  container-config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify Compose localhost and container security contract (no model build)
        env:
          IHSANVISION_MODELS_DIR: /tmp/ci-private-models-placeholder
          IHSANVISION_API_KEY: ci-only-placeholder-not-a-real-secret
        run: |
          docker compose -f compose.yaml config --quiet
          python3 - <<'PY'
          import json
          import subprocess

          rendered = subprocess.check_output(
              ["docker", "compose", "-f", "compose.yaml", "config", "--format", "json"]
          )
          config = json.loads(rendered)
          service = config["services"]["ihsanvision"]
          assert service.get("read_only") is True
          assert service.get("user") == "10001:10001"
          assert "ALL" in service.get("cap_drop", [])
          ports = service.get("ports", [])
          assert len(ports) == 1 and ports[0].get("host_ip") == "127.0.0.1"
          assert ports[0].get("published") == "8080"
          mounts = service.get("volumes", [])
          assert any(
              mount.get("type") == "bind"
              and mount.get("target") == "/models"
              and mount.get("read_only") is True
              for mount in mounts
          )
          print("Compose security/config shape verified; real image build and inference NOT tested.")
          PY
